<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Official form preview harness</title>
  </head>
  <body>
    <p>Building document…</p>
    <script type="module">
      // TEMPORARY verification harness. Renders the real official-form output so
      // it can be printed to PDF by headless Chromium and measured.
      import { buildOfficialProposalHtml } from '@/utils/officialProposalForm'

      const CASE = new URLSearchParams(location.search).get('case') || 'full'
      const LONG = CASE === 'long' || CASE === 'multi'
      const MANY = CASE === 'rows' || CASE === 'multi'

      const sentence = (i) =>
        `Paragraph ${i + 1}. The project team will validate the intervention against baseline ` +
        `measurements collected from the coastal barangays of Naawan and neighbouring municipalities, ` +
        `comparing water quality indices before, during and after deployment of the monitoring network.`
      const para = (n) => Array.from({ length: n }, (_, i) => sentence(i)).join(' ')

      const sites = Array.from({ length: CASE === 'sites' || MANY ? 12 : 3 }, (_, i) => ({
        country: 'Philippines',
        region: 'Region X',
        province: 'Misamis Oriental',
        district: `District ${i + 1}`,
        municipality: 'Naawan',
        barangay: `Barangay ${i + 1}`
      }))

      const proposal = {
        proposalCode: '041',
        documentId: 'MSUN-ORPS-DA-041-2026-REV00',
        revisionNumber: 0,
        programTitle: 'Coastal Resource Management Program',
        projectTitle: 'Automated Water Quality Monitoring for Naawan Coastal Waters',
        projectLeader: 'Bani Longayy',
        projectLeaderSex: 'Male',
        duration: '24',
        startDate: '2026-01-05',
        endDate: '2027-12-20',
        college: 'College of Business and Information Technology',
        address: 'MSU at Naawan, Naawan, Misamis Oriental 9023, Philippines',
        cooperatingAgencies: LONG
          ? para(4)
          : 'Local Government Unit of Naawan; Bureau of Fisheries and Aquatic Resources - Region X',
        sites,
        researchType: 'Applied',
        priorityAgendas: [
          { agendaKey: 'dagat', selected: true, value: 'Coastal and marine resource sustainability' },
          { agendaKey: 'punla', selected: true, value: 'Community-based monitoring technologies' },
          { agendaKey: 'kalikasan', selected: true, value: 'Environmental monitoring and resilience' }
        ],
        innovationGoals: para(LONG ? 6 : 1),
        sectorRelevance: para(LONG ? 6 : 1),
        sdg: ['SDG 6: Clean Water and Sanitation', 'SDG 14: Life Below Water'],
        executiveSummary: para(LONG ? 14 : 2),
        rationale: para(LONG ? 14 : 2),
        framework: para(LONG ? 12 : 2),
        objectivesGeneral: para(LONG ? 4 : 1),
        objectivesSpecific:
          '1. Deploy autonomous sensor buoys across five monitoring stations.\n' +
          '2. Establish a real-time data pipeline with automated quality flags.\n' +
          '3. Train local government operators on calibration and maintenance.',
        review: para(LONG ? 16 : 2),
        methodology: para(LONG ? 16 : 2),
        technologyTrl: '6',
        outputs:
          'Prototype: sensor buoy assembly\nPublication: Scopus-indexed journal article\n' +
          'Patent: utility model application\nProduct: monitoring dashboard\n' +
          'People: trained LGU personnel\nPolicy: draft local ordinance',
        outcomes: para(LONG ? 8 : 1),
        impactEconomic: para(LONG ? 8 : 1),
        impactSocial: para(LONG ? 8 : 1),
        beneficiaries: para(LONG ? 6 : 1),
        sustainability: para(LONG ? 6 : 1),
        gadScore: '8.50',
        risks: para(LONG ? 8 : 1),
        referencesText: para(LONG ? 10 : 2),
        logFrames: Array.from({ length: MANY ? 10 : 2 }, (_, i) => ({
          outcome: `Outcome indicator ${i + 1}: improved water quality index`,
          output: `Output indicator ${i + 1}: monitoring station ${i + 1} operational`
        })),
        personnel: Array.from({ length: MANY ? 12 : 3 }, (_, i) => ({
          position: `Project Staff ${i + 1}`,
          timeDevoted: `${(i + 1) * 5}%`,
          responsibilities: `Field sampling, calibration and data validation for station ${i + 1}`
        })),
        budget: Array.from({ length: MANY ? 12 : 3 }, (_, i) => ({
          agency: `MSU at Naawan - Line ${i + 1}`,
          ps: `${(i + 1) * 1000}.00`,
          mooe: `${(i + 1) * 2000}.00`,
          eo: `${(i + 1) * 500}.00`,
          total: `${(i + 1) * 3500}.00`
        })),
        otherProjectsNumber: MANY ? '8' : '2',
        otherProjects: Array.from({ length: MANY ? 8 : 2 }, (_, i) => ({
          title: `Ongoing project ${i + 1}`,
          agency: 'DOST-PCAARRD',
          involvement: 'Project Leader'
        })),
        limitations: Array.from({ length: MANY ? 8 : 2 }, (_, i) => ({
          limitation: `Limitation ${i + 1}: sensor drift in turbid water`,
          remarks: `Mitigation ${i + 1}: monthly laboratory cross-checks`
        })),
        reviewFileName: 'review-of-literature.pdf',
        roadmapFileName: 'technology-roadmap.pdf',
        gadFileName: 'gad-score.pdf'
      }

      if (CASE === 'empty') {
        proposal.proposalCode = ''
        proposal.documentId = ''
        proposal.revisionNumber = null
        proposal.programTitle = ''
        proposal.projectLeader = ''
        proposal.projectLeaderSex = ''
        proposal.duration = ''
        proposal.startDate = ''
        proposal.endDate = ''
        proposal.college = ''
        proposal.address = ''
        proposal.cooperatingAgencies = ''
        proposal.sites = []
        proposal.priorityAgendas = []
        proposal.innovationGoals = ''
        proposal.sectorRelevance = ''
        proposal.sdg = []
        proposal.executiveSummary = ''
        proposal.rationale = ''
        proposal.framework = ''
        proposal.objectivesGeneral = ''
        proposal.objectivesSpecific = ''
        proposal.review = ''
        proposal.methodology = ''
        proposal.technologyTrl = ''
        proposal.outputs = ''
        proposal.outcomes = ''
        proposal.impactEconomic = ''
        proposal.impactSocial = ''
        proposal.beneficiaries = ''
        proposal.sustainability = ''
        proposal.gadScore = null
        proposal.risks = ''
        proposal.referencesText = ''
        proposal.logFrames = []
        proposal.personnel = []
        proposal.budget = []
        proposal.otherProjectsNumber = ''
        proposal.otherProjects = []
        proposal.limitations = []
        proposal.reviewFileName = ''
        proposal.roadmapFileName = ''
        proposal.gadFileName = ''
      }

      const html = buildOfficialProposalHtml(proposal)
      const parsed = new DOMParser().parseFromString(html, 'text/html')
      document.head.innerHTML = parsed.head.innerHTML
      document.body.innerHTML = parsed.body.innerHTML
    </script>
  </body>
</html>
