# =====================================================================
# Load-test profile  (SPRING_PROFILES_ACTIVE=loadtest)
# ---------------------------------------------------------------------
# Points the application at the ISOLATED test database and turns on the synthetic
# data set. This is the profile the k6 load tests run against.
#
# It is deliberately separate from the `test` profile used by `mvn test`:
#   * `test` uses ddl-auto=create-drop, so its schema disappears when the test run
#     ends - useless for a database that has to stay populated while k6 runs;
#   * `loadtest` uses ddl-auto=update so the schema survives, and runs on its own
#     port so it never disturbs a developer instance on 8081.
#
# Nothing here can reach a real database: SyntheticTestDataSeeder refuses to run
# unless the live connection points at rpis_test (see DatabaseSafetyGuard).
# =====================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/rpis_test
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema has to outlive the process, so Hibernate creates/updates it here
# instead of dropping it on shutdown.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# A separate port from the developer default, so a developer backend can keep running on
# 8081 at the same time.
#
# The port is NOT hardcoded here: it is read from RPIS_SERVER_PORT so several instances
# can run side by side on one host (which is exactly what the multi-instance verification
# needs). The fallback is 8082.
server.port=${RPIS_SERVER_PORT:8082}

# Turn the synthetic data set on. The seeder is a no-op on a second start because it
# records the batch it generated (see synthetic_seed_registry).
rpis.seed.synthetic.enabled=true

# The pool is sized for the load test rather than for a single developer, and it
# deliberately does NOT override the shared value: the measured sizing rule and the
# arithmetic behind it live in application.properties. Overriding it here is what
# silently kept a previous run at the old size, so the value is only stated once.
# PostgreSQL here allows 100 connections, so 40 for one instance leaves ample room
# for psql, the test suite, monitoring and a second instance.

# Mail is not exercised by the load test.
spring.mail.host=localhost
spring.mail.port=3025
