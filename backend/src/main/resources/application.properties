spring.application.name=rpis-backend

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
# The real limit for an uploaded Technology Map image is 10 MB (10 * 1024 * 1024
# bytes) and ProposalService enforces it, answering with the same readable message the
# form shows. The container ceilings below sit one MB above that limit, so a file of
# exactly 10 MB - and the multipart envelope that carries it - always reaches the
# application instead of being cut off by the container; a request beyond the ceiling
# is still refused (with 413) by the container itself.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=jdbc:postgresql://localhost:5432/rpis_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

# Spring Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=change-to-your-email@gmail.com
spring.mail.password=change-to-your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true