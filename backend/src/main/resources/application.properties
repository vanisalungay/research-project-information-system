spring.application.name=rpis-backend

# =====================================================================
# RPIS backend - environment-independent configuration
# ---------------------------------------------------------------------
# Everything that differs between a developer laptop, a single test box and a
# load-balanced deployment lives in a profile file:
#
#   application-dev.properties   local development  (SQL logging on, ddl-auto=update)
#   application-prod.properties  production         (no SQL logging, ddl-auto=validate)
#
# Activate one with SPRING_PROFILES_ACTIVE=dev / prod. With no profile active the
# conservative values in this file apply - that is the configuration the load
# tests measure, so the numbers in load-tests/RESULTS.md describe exactly this
# setup.
#
# Connection details and secrets are read from environment variables with the
# previous hard-coded values as defaults, so an existing local setup keeps
# working unchanged while each deployment (or each instance behind the load
# balancer) can override them without touching a committed file.
# =====================================================================

# ---- Multipart file upload configuration ----
spring.servlet.multipart.enabled=true
# The real limit for an uploaded Technology Map image is 10 MB (10 * 1024 * 1024
# bytes) and ProposalService enforces it, answering with the same readable message the
# form shows. The container ceilings below sit one MB above that limit, so a file of
# exactly 10 MB - and the multipart envelope that carries it - always reaches the
# application instead of being cut off by the container; a request beyond the ceiling
# is still refused (with 413) by the container itself.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

# ---- Datasource ----
spring.datasource.url=${RPIS_DB_URL:jdbc:postgresql://localhost:5432/rpis_db}
spring.datasource.username=${RPIS_DB_USER:postgres}
spring.datasource.password=${RPIS_DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Connection pool (HikariCP) ----
# Sized from measurement, not from a guess. The rule is Little's Law for a
# connection pool:
#
#     connections = ceil( peak request throughput  x  mean time a request holds
#                         a connection )  +  headroom
#
# The 500-user calibration run (load-tests/RESULTS.md) measured:
#
#     293.7 requests/s sustained, with a pool of 20 connections fully checked out
#     and only ~6 of them ever executing a query at the same instant
#     -> mean connection hold time = 20 / 293.7 = 68 ms
#
# At that hold time a pool of 20 sits exactly on the utilisation limit, which is why
# p95 was ~520 ms: the requests that arrived on top of the 20 in flight waited for a
# connection instead of being served. The requirement is 500 concurrent users, so the
# pool is sized to cover the measured concurrency rather than the measured minimum.
# With the pool raised, the same run then measured a hold time of
# 18 connections / 328.6 req/s = 55 ms, giving
#
#     40 connections x (1 / 0.055 s) = ~727 requests/s of capacity
#
# i.e. roughly 2x the 328 req/s measured at 500 users, which is the headroom needed
# for the peak of the ramp and for one instance to be lost. It is not oversized:
# PostgreSQL here allows 100 connections, and 40 leaves 60 for psql, the test suite,
# monitoring and a second instance.
#
# IMPORTANT for multiple instances: each backend instance owns its own pool, so
#     instances x maximum-pool-size  <=  PostgreSQL max_connections - reserved
# must hold, or instances will start failing with "too many clients already".
# Override per instance with RPIS_DB_POOL_SIZE when scaling out.
spring.datasource.hikari.maximum-pool-size=${RPIS_DB_POOL_SIZE:40}
# A small warm floor keeps the first requests after a restart off the
# connect-and-authenticate path without holding 40 idle connections forever.
spring.datasource.hikari.minimum-idle=${RPIS_DB_POOL_MIN_IDLE:10}
# A request waits at most this long for a connection before failing with a clear
# 500 instead of hanging until the browser gives up. Kept short: at 500 users a
# long wait only converts a fast failure into a slow one.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
# Idle connections are released after 5 minutes, and no connection is kept longer
# than 30 minutes so a database failover is picked up without a restart.
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
# Logs a stack trace when a connection is held longer than 20s. This is a
# diagnostic, not a limit: it makes a leaked or slow connection visible instead of
# silently starving the pool.
spring.datasource.hikari.leak-detection-threshold=20000

# ---- HTTP server (Tomcat) ----
# Threads and connections are sized together with the pool above. A thread that
# cannot get a connection is not useful work, so the thread ceiling is kept close
# to the pool size plus the short, non-database-bound requests (health probes,
# static files).
server.port=${RPIS_SERVER_PORT:8081}
server.tomcat.threads.max=${RPIS_TOMCAT_THREADS:120}
server.tomcat.threads.min-spare=10
# Requests beyond the thread ceiling wait in this queue rather than being refused.
#
# Measured: 300 was NOT enough for the login-burst scenario, where 500 virtual users
# open a connection in the same instant. Tomcat passes this value to the server
# socket bind, so it is also the operating system's listen backlog; with 300 the
# kernel refused 109 of 500 simultaneous connections before the application ever saw
# them (21.8% error rate, "connection refused"). 1000 leaves room for a full 500-user
# burst to arrive plus the connections still being served. See load-tests/RESULTS.md.
server.tomcat.accept-count=1000
server.tomcat.max-connections=4000
# How long a client may take to send its request head/body. A stalled client must
# not occupy a worker thread indefinitely.
server.tomcat.connection-timeout=20000
# Keep-alive reuses the TCP setup for the burst of parallel calls a single
# dashboard load makes.
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-keep-alive-requests=200

# ---- Graceful shutdown ----
# Required behind a load balancer: on SIGTERM the instance stops accepting new
# requests, finishes the in-flight ones, then exits, so a rolling restart never
# produces 502s for users who were mid-request.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema management is profile-specific; the safe default is "do not touch the
# schema". application-dev.properties restores ddl-auto=update for local work.
spring.jpa.hibernate.ddl-auto=${RPIS_JPA_DDL_AUTO:none}

# SQL logging is OFF here. It was previously enabled for every environment,
# which formats and prints every statement of every request; at 500 concurrent
# users that alone saturates stdout. application-dev.properties turns it back on
# for local work.
spring.jpa.show-sql=${RPIS_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${RPIS_JPA_FORMAT_SQL:false}

# The Proposal entity carries seven @OneToMany collections that the proposal
# endpoints serialize. Without a batch size, Hibernate issues one SELECT per
# collection per row (7 extra queries for every proposal in a list - the classic
# N+1). Batch fetching collapses those into one query per 50 rows.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Batching for writes (reviews, remarks, seeded data) instead of one round trip
# per row.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Keep the Hibernate session open while a response is serialized. The proposal
# responses rely on it for their lazy collections; the N+1 cost it would normally
# introduce is handled by default_batch_fetch_size above rather than by disabling
# this, which would break existing endpoints.
spring.jpa.open-in-view=true

# Connection release mode: deliberately left at the Hibernate default
# (DELAYED_ACQUISITION_AND_HOLD for a resource-local transaction).
#
# Two alternatives were measured at 500 users and both were worse, so this is the
# setting that stays. The numbers below are from load-tests/RESULTS.md and the
# comparison is fair: same database, same 500 VUs, same 20-connection pool.
#
#   default (hold for the request)      : 293.7 req/s, 0.000% errors, p95 521 ms
#   release after every statement       : 264.0 req/s, 0.450% errors, p95 900 ms
#   release at transaction end          : 267.9 req/s, 0.000% errors, p95 754 ms
#
# The reason: a proposal-list request issues ~8 statements and, with the session
# open during serialization, also lazy-loads after the transaction has ended. The
# alternatives turn those into repeated acquire/release cycles against an already
# contended pool, which multiplies queueing. The real limit was therefore how many
# requests need a connection at the same moment - the pool size - which is what the
# sizing note above addresses. Do not "optimise" this without re-measuring.

# ---- Mail ----
spring.mail.host=${RPIS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${RPIS_MAIL_PORT:587}
spring.mail.username=${RPIS_MAIL_USERNAME:change-to-your-email@gmail.com}
spring.mail.password=${RPIS_MAIL_PASSWORD:change-to-your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Uploaded document storage ----
# Where uploaded documents live (signatures, endorsement letters, technology maps,
# line-item budgets, Special Orders, reporting-stage documents).
#
# The root MUST be an absolute path in a real deployment, and every instance behind the
# load balancer must point at the same location - otherwise a file uploaded through one
# instance cannot be downloaded through another. Previously this was a relative
# "uploads" resolved against the process working directory, which is why the repository
# contains two different upload directories.
#
# The default keeps the historic behaviour so an existing single-instance setup keeps
# working; a deployment sets RPIS_UPLOAD_DIR (for example C:\rpis-data\uploads or
# /var/lib/rpis/uploads).
#
# rpis.storage.type selects the implementation. Only "local" exists today; the
# UploadStorage interface is deliberately byte/stream oriented so an object-storage
# backend can be added without touching the callers.
rpis.storage.type=${RPIS_STORAGE_TYPE:local}
rpis.storage.upload-dir=${RPIS_UPLOAD_DIR:uploads}

# ---- Application security ----
# The HMAC key that signs bearer tokens. It must be identical on every instance
# behind the load balancer, otherwise a token minted by instance A is rejected by
# instance B. The previous hard-coded value is kept as the default so existing
# sessions keep working; set RPIS_TOKEN_SECRET per deployment to rotate it.
rpis.security.token-secret=${RPIS_TOKEN_SECRET:RPIS_SUPER_SECURE_HMAC_SIGNING_KEY_2026_CHANGE_THIS_IN_PROD}
rpis.security.token-ttl-ms=${RPIS_TOKEN_TTL_MS:86400000}

# Convert any account whose password is still stored as plain text into a BCrypt hash
# at start-up. Off by default so a deployment chooses when it happens; an account is
# in any case upgraded automatically the next time its owner signs in successfully, so
# leaving this off never locks anybody out - it only leaves the old rows unhashed for
# longer. Safe to enable on every start-up: rows that are already hashes are skipped.
rpis.security.password-migration.enabled=${RPIS_PASSWORD_MIGRATION:false}

# Origins allowed to call the API. "*" keeps the previous behaviour; a real
# deployment sets RPIS_CORS_ALLOWED_ORIGINS to its own front-end origin(s).
rpis.cors.allowed-origins=${RPIS_CORS_ALLOWED_ORIGINS:*}

# ---- Start-up data steps (all default OFF) ----
# The demo accounts were previously inserted on every start-up of every instance.
# They are now opt-in, and the endpoint that triggers them is closed by default,
# so a production database can never be populated with known-password accounts.
rpis.seed.default-users.enabled=${RPIS_SEED_DEFAULT_USERS:false}
# Snapshot/repair of the proposal version history. Idempotent, but with several
# instances starting together it is unnecessary work on the shared database.
rpis.bootstrap.proposal-version-backfill.enabled=${RPIS_BACKFILL_PROPOSAL_VERSIONS:false}
# Synthetic load-test data set. Refuses to run against anything but rpis_test.
rpis.seed.synthetic.enabled=${RPIS_SEED_SYNTHETIC:false}

# ---- Observability (actuator) ----
# Only the endpoints used by the load tests and by an operator are exposed.
# /actuator/health answers liveness; metrics is what the load test reads to report
# CPU, thread-pool and connection-pool behaviour next to k6's own numbers.
management.endpoints.web.exposure.include=health,info,metrics
# The public health probe must not leak component details.
management.endpoint.health.show-details=never
# The three pools that decide whether 500 concurrent users fit: the JDBC pool, the
# Tomcat worker pool, and the JVM itself.
management.metrics.enable.jvm=true
management.metrics.enable.hikaricp=true
management.metrics.enable.tomcat=true
management.metrics.enable.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true