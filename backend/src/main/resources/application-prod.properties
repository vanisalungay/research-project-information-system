# =====================================================================
# Production / load-balanced profile  (SPRING_PROFILES_ACTIVE=prod)
# ---------------------------------------------------------------------
# Assumes several identical instances run behind a load balancer against one
# PostgreSQL server. The differences from the shared configuration are exactly
# the things that are unsafe when more than one instance is running.
# =====================================================================

# ---- Secrets are REQUIRED here, with no fallback ----
# The shared configuration supplies development defaults for these (a local database
# password and a published signing key). Those defaults are in the repository, so
# anyone who can read the repository knows them - which is fine for a laptop and
# unacceptable for a deployment. Referencing the variable with no default makes the
# application refuse to start instead of silently running on a known secret.
#
# Set both in the environment of every instance:
#   RPIS_DB_PASSWORD   the PostgreSQL password for the application account
#   RPIS_TOKEN_SECRET  the bearer-token signing key; MUST be identical on every
#                      instance, because a token minted by one instance is verified
#                      by whichever instance receives the next request
#
# Rotating RPIS_TOKEN_SECRET invalidates every issued token, so all users sign in
# again - plan it accordingly.
rpis.security.token-secret=${RPIS_TOKEN_SECRET}
spring.datasource.password=${RPIS_DB_PASSWORD}

# Never let an instance alter the schema. With several instances starting
# together, ddl-auto=update makes them race to run the same ALTER TABLE, and a
# mistake here is unrecoverable. The schema is applied deliberately, by hand,
# with the backend/migration-*.sql scripts before the instances are started.
# See backend/DEPLOYMENT.md for the ordered runbook.
spring.jpa.hibernate.ddl-auto=validate

# No SQL logging: it is the largest avoidable per-request cost, and at 500 users
# the log volume alone will fill the disk.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# No start-up data steps. A production database is never populated by the
# application, and the backfill/reconcile work belongs in a one-off maintenance
# run rather than in the start-up path of every instance.
rpis.seed.default-users.enabled=false
rpis.bootstrap.proposal-version-backfill.enabled=false
rpis.seed.synthetic.enabled=false

# Nothing here overrides the pool size on purpose: the per-instance value comes
# from RPIS_DB_POOL_SIZE so the operator can satisfy
#     instances x pool <= PostgreSQL max_connections - reserved
# for their actual instance count. See application.properties for the sizing rule.
