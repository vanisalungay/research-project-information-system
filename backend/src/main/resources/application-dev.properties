# =====================================================================
# Local development profile  (SPRING_PROFILES_ACTIVE=dev)
# ---------------------------------------------------------------------
# Restores the developer conveniences that used to be baked into the shared
# application.properties: verbose SQL, formatted SQL and Hibernate creating /
# updating the schema from the entities.
#
# These settings are NOT suitable for a load-balanced deployment: several
# instances starting together would race to alter the same schema, and printing
# every statement is the single largest avoidable cost per request.
# =====================================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# A developer machine serves one person, so a small pool is enough and leaves
# room for psql and the test suite on the same PostgreSQL instance.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# The demo accounts are convenient locally and are the reason the previous
# behaviour (seed on every start-up) is preserved here, where the target database
# is the developer's own.
rpis.seed.default-users.enabled=true
