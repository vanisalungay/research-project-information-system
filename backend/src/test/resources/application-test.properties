# ---------------------------------------------------------------------------
# Test profile: isolated PostgreSQL database.
# NEVER points at the live rpis_db. The schema is created/dropped by Hibernate
# in rpis_test only, so concurrency tests run against a real PostgreSQL engine
# without touching production data.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/rpis_test
rpis.db.expected-name=rpis_test
spring.datasource.username=postgres
# ---------------------------------------------------------------------------
# Upload storage, pinned deliberately.
#
# The shared configuration reads the root from RPIS_UPLOAD_DIR, which a deployment sets
# to a real absolute path. If the tests inherited that variable they would write into -
# and assert against - the real upload directory, and the assertions would fail
# confusingly depending on who ran them.
#
# The value is a TEST-ONLY directory under target/ (wiped by `mvn clean`). It used to be
# the historic relative "uploads", which resolves to the application's own
# backend/uploads directory: every test run then wrote real endorsement letters into the
# folder the running application uses. Because the test schema is created and dropped each
# run, the same reference numbers (and therefore the same Document Codes) were minted on
# every run, so the folder filled with letters that all shared a handful of codes and
# looked - wrongly - like the Document Code was being reused across endorsements. Pinning a
# target-relative directory keeps the tests reproducible AND stops them polluting the
# application's own storage.
# ---------------------------------------------------------------------------
rpis.storage.upload-dir=target/test-uploads

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Schema bootstrap is enabled here ONLY because this profile builds its schema from the
# entities in the disposable rpis_test database (ddl-auto=create-drop) and the suite depends
# on the two sequences, the partial unique index and the CHECK constraint. Everywhere else
# these default to false.
rpis.bootstrap.sequences.enabled=true
rpis.bootstrap.cooperating-agencies.enabled=true
rpis.bootstrap.priority-agendas.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MockMvc context: do not bind a web port.
server.port=0

# Mail is not exercised by the tests.
spring.mail.host=localhost
spring.mail.port=3025
