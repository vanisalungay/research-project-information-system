# ---------------------------------------------------------------------------
# Test profile: isolated PostgreSQL database.
# NEVER points at the live rpis_db. The schema is created/dropped by Hibernate
# in rpis_test only, so concurrency tests run against a real PostgreSQL engine
# without touching production data.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/rpis_test
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MockMvc context: do not bind a web port.
server.port=0

# Mail is not exercised by the tests.
spring.mail.host=localhost
spring.mail.port=3025
