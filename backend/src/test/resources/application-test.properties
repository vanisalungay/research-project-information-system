# ---------------------------------------------------------------------------
# Test profile: isolated PostgreSQL database.
# NEVER points at the live rpis_db. The schema is created/dropped by Hibernate
# in rpis_test only, so concurrency tests run against a real PostgreSQL engine
# without touching production data.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/rpis_test
spring.datasource.username=postgres
# ---------------------------------------------------------------------------
# Upload storage, pinned deliberately.
#
# The shared configuration reads the root from RPIS_UPLOAD_DIR, which a deployment sets
# to a real absolute path. If the tests inherited that variable they would write into -
# and assert against - the real upload directory, and the assertions would fail
# confusingly depending on who ran them. Pinning the property here removes that ambient
# dependency, so a test run is reproducible on any machine.
#
# The value stays the historic relative "uploads", which resolves to backend/uploads
# when the tests run from backend/ - the directory the existing tests already resolve
# their expectations against.
# ---------------------------------------------------------------------------
rpis.storage.upload-dir=uploads

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MockMvc context: do not bind a web port.
server.port=0

# Mail is not exercised by the tests.
spring.mail.host=localhost
spring.mail.port=3025
